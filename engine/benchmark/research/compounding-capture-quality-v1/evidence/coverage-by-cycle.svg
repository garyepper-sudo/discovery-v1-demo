<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="graph1-title graph1-desc"><title id="graph1-title">Relevant current-state coverage by cycle</title><desc id="graph1-desc">Mean coverage and deterministic 95% scenario by seed cluster-bootstrap intervals for four conditions. Exact method: 95% type-7 percentile interval. All 32 intervals collapse to their means in this synthetic slice.</desc><defs><clipPath id="plot-clip"><rect x="90" y="105" width="1030" height="450"/></clipPath></defs><g id="background-grid"><rect width="1200" height="720" fill="white"/><path d="M90 350H1120 M90 145H1120" stroke="#e5e5e5" stroke-width="1"/></g><g id="uncertainty-bands"><path class="uncertainty-band" data-condition="A" data-cycles="8" d="M 110,145 245,334.23058 380,403.94739 515,440.2 650,440.2 785,440.2 920,440.2 1055,440.2 1055,440.2 920,440.2 785,440.2 650,440.2 515,440.2 380,403.94739 245,334.23058 110,145 Z" fill="#555" fill-opacity="0.18" stroke="#555" stroke-width="1" clip-path="url(#plot-clip)"/><path class="uncertainty-band" data-condition="B" data-cycles="8" d="M 110,145 245,145 380,145 515,145 650,145 785,145 920,145 1055,145 1055,145 920,145 785,145 650,145 515,145 380,145 245,145 110,145 Z" fill="#1769aa" fill-opacity="0.18" stroke="#1769aa" stroke-width="1" clip-path="url(#plot-clip)"/><path class="uncertainty-band" data-condition="C" data-cycles="8" d="M 110,145 245,145 380,145 515,145 650,145 785,145 920,145 1055,145 1055,145 920,145 785,145 650,145 515,145 380,145 245,145 110,145 Z" fill="#087f23" fill-opacity="0.18" stroke="#087f23" stroke-width="1" clip-path="url(#plot-clip)"/><path class="uncertainty-band" data-condition="D" data-cycles="8" d="M 110,145 245,176.53843 380,296.05261 515,358.2 650,358.2 785,358.2 920,358.2 1055,358.2 1055,358.2 920,358.2 785,358.2 650,358.2 515,358.2 380,296.05261 245,176.53843 110,145 Z" fill="#c66a00" fill-opacity="0.18" stroke="#c66a00" stroke-width="1" clip-path="url(#plot-clip)"/></g><g id="mean-series"><polyline class="mean-line" data-condition="A" fill="none" stroke="#555" stroke-width="4" clip-path="url(#plot-clip)" points="110,145 245,334.23058 380,403.94739 515,440.2 650,440.2 785,440.2 920,440.2 1055,440.2"/><polyline class="mean-line" data-condition="B" fill="none" stroke="#1769aa" stroke-width="4" stroke-dasharray="12 7" clip-path="url(#plot-clip)" points="110,145 245,145 380,145 515,145 650,145 785,145 920,145 1055,145"/><polyline class="mean-line" data-condition="C" fill="none" stroke="#087f23" stroke-width="4" clip-path="url(#plot-clip)" points="110,145 245,145 380,145 515,145 650,145 785,145 920,145 1055,145"/><circle class="mean-marker" data-condition="C" cx="110" cy="145" r="3.5" fill="white" stroke="#087f23" stroke-width="2"/><circle class="mean-marker" data-condition="C" cx="245" cy="145" r="3.5" fill="white" stroke="#087f23" stroke-width="2"/><circle class="mean-marker" data-condition="C" cx="380" cy="145" r="3.5" fill="white" stroke="#087f23" stroke-width="2"/><circle class="mean-marker" data-condition="C" cx="515" cy="145" r="3.5" fill="white" stroke="#087f23" stroke-width="2"/><circle class="mean-marker" data-condition="C" cx="650" cy="145" r="3.5" fill="white" stroke="#087f23" stroke-width="2"/><circle class="mean-marker" data-condition="C" cx="785" cy="145" r="3.5" fill="white" stroke="#087f23" stroke-width="2"/><circle class="mean-marker" data-condition="C" cx="920" cy="145" r="3.5" fill="white" stroke="#087f23" stroke-width="2"/><circle class="mean-marker" data-condition="C" cx="1055" cy="145" r="3.5" fill="white" stroke="#087f23" stroke-width="2"/><polyline class="mean-line" data-condition="D" fill="none" stroke="#c66a00" stroke-width="4" clip-path="url(#plot-clip)" points="110,145 245,176.53843 380,296.05261 515,358.2 650,358.2 785,358.2 920,358.2 1055,358.2"/></g><g id="axes-labels"><path d="M90 105V555H1120" stroke="#222" fill="none"/><text x="600" y="28" text-anchor="middle" font-size="17" font-weight="bold">SYNTHETIC BENCHMARK — NOT CUSTOMER OR PRODUCTION EVIDENCE</text><text x="600" y="56" text-anchor="middle" font-size="23">Relevant current-state coverage by cycle</text><text x="600" y="78" text-anchor="middle" font-size="12"><tspan x="600">budget 2048 estimated tokens · review quality 100 · 95% CI</tspan><tspan x="600" dy="15">type-7 percentile interval from 5,000 scenario × seed cluster resamples</tspan></text><text x="600" y="704" text-anchor="middle">cycle</text><text x="24" y="330" transform="rotate(-90 24 330)" text-anchor="middle">coverage</text></g><g id="legend" aria-label="Condition legend"><rect x="866" y="101" width="268" height="132" rx="5" fill="white" fill-opacity="0.92" stroke="#bbb"/><line class="legend-swatch" data-condition="A" x1="886" y1="122" x2="942" y2="122" stroke="#555" stroke-width="4"/><text x="952" y="127" font-size="14" fill="#555">current raw</text><line class="legend-swatch" data-condition="B" x1="886" y1="150" x2="942" y2="150" stroke="#1769aa" stroke-width="4" stroke-dasharray="12 7"/><text x="952" y="155" font-size="14" fill="#1769aa">full history</text><line class="legend-swatch" data-condition="C" x1="886" y1="178" x2="942" y2="178" stroke="#087f23" stroke-width="4"/><circle cx="914" cy="178" r="3.5" fill="white" stroke="#087f23" stroke-width="2"/><text x="952" y="183" font-size="14" fill="#087f23">reviewed state</text><line class="legend-swatch" data-condition="D" x1="886" y1="206" x2="942" y2="206" stroke="#c66a00" stroke-width="4"/><text x="952" y="211" font-size="14" fill="#c66a00">unreviewed summary</text></g><g id="annotations"><text x="600" y="580" text-anchor="middle" font-size="13" font-weight="bold"><tspan x="600">Observed interval width was zero in 32 of 32 condition-cycle cells</tspan><tspan x="600" dy="16">for this deterministic synthetic slice.</tspan></text><text x="600" y="620" text-anchor="middle" font-size="12"><tspan x="600">Where a band is not wider than its line, all 15 scenario × seed units produced the same value.</tspan><tspan x="600" dy="15">This is metric saturation in this slice; it does not imply real-world certainty or robustness.</tspan></text><text x="600" y="662" text-anchor="middle" font-size="11" font-weight="bold"><tspan x="600">SYNTHETIC BENCHMARK — NOT CUSTOMER OR PRODUCTION EVIDENCE</tspan><tspan x="600" dy="15">Methodology illustration only; structural support is synthetic, efficiency is inconclusive, and stale-biased review is harmful.</tspan></text></g></svg>
